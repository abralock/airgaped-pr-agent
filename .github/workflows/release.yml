name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch gitleaks (checksum-verified)
        run: scripts/fetch-gitleaks.sh
      - name: Test suite in the image (linux/amd64)
        run: docker build --platform linux/amd64 --target test .
      - name: Image name and tags
        id: image
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          name="ghcr.io/$owner/airgaped-pr-agent"
          tags="$name:$GITHUB_REF_NAME"
          # A prerelease tag (v0.2.0-rc1) never moves :latest.
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            tags="$tags,$name:latest"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build offline bundle (linux x86_64)
        run: PYTHON=python scripts/build-bundle.sh
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pr-agent-bundle-*.tar.gz
            dist/pr-agent-bundle-*.tar.gz.sha256
