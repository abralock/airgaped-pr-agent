# Bundled gitleaks config: the upstream default rules plus rules for hardcoded
# passwords and credentialed connection strings, which the defaults miss when
# the value is short or contains punctuation (e.g. password = "Hunter2!prod").
#
# The key must END with the credential word (optionally followed by digits),
# so dbPassword, client_secret and DB_PASS match while tokenizer, token_url,
# password_reset_url or secretKeyRef do not. Short words (pwd, pass) must
# start the key or follow a separator, so that compass/bypass don't match.
#
# NOTE: gitleaks joins the regexes of an allowlist into one alternation, so a
# leading (?i) would leak into every other entry. Case-insensitive entries use
# the scoped form (?i:...) instead.

[extend]
useDefault = true

[[rules]]
id = "hardcoded-password"
description = "Hardcoded password or secret assigned to a credential-named key"
regex = '''(?i)(?:password|passwd|secret|token|api[_-]?key|(?:\b|[_.-])(?:pwd|pass))\d*["']?\]?[ \t]{0,5}(?::=|=>|=|:)[ \t]{0,5}["']([^"'\s]{6,200})["']'''
secretGroup = 1
entropy = 3.0
keywords = ["password", "passwd", "pwd", "pass", "secret", "token", "api_key", "api-key", "apikey"]

[[rules]]
id = "hardcoded-password-unquoted"
description = "Hardcoded password or secret in a config file"
# Unquoted values only occur in config formats: .env, YAML, properties, INI.
path = '''(?i)(?:^|/)(?:\.env(?:\.[\w.-]+)?|[^/]+\.(?:ya?ml|properties|ini|cfg|conf|toml))$'''
regex = '''(?im)(?:password|passwd|secret|token|api[_-]?key|(?:\b|[_.-])(?:pwd|pass))\d*[ \t]{0,5}(?:=|:)[ \t]{0,5}([^\s"'#;]{6,200})(?:\s|$)'''
secretGroup = 1
entropy = 3.0
keywords = ["password", "passwd", "pwd", "pass", "secret", "token", "api_key", "api-key", "apikey"]

[[rules.allowlists]]
description = "YAML tags, anchors, aliases and block scalars"
regexTarget = "secret"
regexes = ['''^[!&*|>]''']

[[rules]]
id = "connection-string-credentials"
description = "Connection string or URL with an embedded password"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|amqps?|mssql|sqlserver|https?|ftps?|jdbc:[a-z0-9]+)://[^:@/\s"']*:([^:@/\s"']{4,200})@[^\s"'/]+'''
secretGroup = 1
keywords = ["://"]

[[rules.allowlists]]
description = "Well-known local development passwords"
regexTarget = "secret"
regexes = ['''(?i:^(?:postgres|root|guest|admin|test|testing|password|passwd|pass|pwd|secret)$)''']

[[rules.allowlists]]
description = "Local-only hosts"
regexTarget = "match"
regexes = ['''(?i:@(?:localhost|127\.0\.0\.1|\[::1\])(?:[:/]|$))''']

# Placeholders and templates: not secrets for any of the password-style rules,
# including the upstream generic-api-key rule.
[[allowlists]]
description = "Placeholders and templates"
targetRules = ["generic-api-key", "hardcoded-password", "hardcoded-password-unquoted", "connection-string-credentials"]
regexTarget = "secret"
regexes = [
  '''(?i:change[_-]?me|placeholder|example|dummy|redacted)''',
  '''(?i:^(?:password|passwd|secret|test|testing|none|null|undefined|empty|todo|tbd)$)''',
  '''(?i:^x{3,}$)''',
  '''^\*{3,}$''',
  '''\$\{[^}]*\}''',
  '''\{\{[^}]*\}\}''',
  '''^<[^>]*>$''',
  '''%\([^)]*\)s''',
  '''^\$[A-Z_][A-Z0-9_]*$''',
  '''^\$\([A-Za-z_][A-Za-z0-9_.]*\)$''',
]

# Values that are names rather than secrets: env var names, identifiers,
# slugs, paths, URLs and ARNs. Not applied to connection strings, whose
# password part has no key name to go by.
[[allowlists]]
description = "Names, identifiers, paths and URLs"
targetRules = ["generic-api-key", "hardcoded-password", "hardcoded-password-unquoted"]
regexTarget = "secret"
regexes = [
  '''^[A-Z][A-Z0-9_]*$''',
  '''(?i:^[a-z]+(?:[-_.][a-z]+)+[?!.:]?$)''',
  '''(?i:^[a-z]+[0-9]*_[a-z0-9]+$)''',
  '''^[a-z]+[0-9]*[a-z]*(?:[-_.][a-z]+[0-9]*)+$''',
  '''^(?:/|https?://|arn:)''',
]
