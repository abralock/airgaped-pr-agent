# Bundled gitleaks config: the upstream default rules plus rules for hardcoded
# passwords and credentialed connection strings, which the defaults miss when
# the value is short or contains punctuation (e.g. password = "Hunter2!prod").
#
# The key must END with the credential word (secret_key, private_key and
# the like count), optionally followed by an environment suffix (_prod,
# _staging, ...) and digits. So dbPassword, client_secret, DB_PASS and
# DB_PASSWORD_PROD match while tokenizer, token_url, password_reset_url or
# secretKeyRef do not. Short words (pwd, pass) must
# start the key or follow a separator, so that compass/bypass don't match.
#
# NOTE: gitleaks joins the regexes of an allowlist into one alternation, so a
# leading (?i) would leak into every other entry. Case-insensitive entries use
# the scoped form (?i:...) instead.

[extend]
useDefault = true

[[rules]]
id = "hardcoded-password"
description = "Hardcoded password or secret assigned to a credential-named key"
regex = '''(?i)(?:password|passwd|secret|token|api[_-]?key|(?:secret|private|access|signing|encryption|master|auth)[_-]?key|(?:\b|[_.-])(?:pwd|pass))(?:[_.-](?:prod|production|dev|development|stage|staging|test|qa|uat|live|local|old|new))?\d*["']?\]?[ \t]{0,5}(?::=|=>|=|:)[ \t]{0,5}["']([^"'\s]{6,200})["']'''
secretGroup = 1
entropy = 3.0
keywords = ["password", "passwd", "pwd", "pass", "secret", "token", "api_key", "api-key", "apikey", "key"]

[[rules]]
id = "hardcoded-password-unquoted"
description = "Hardcoded password or secret in a config file"
# Unquoted values only occur in config formats: .env/*.env/.envrc, YAML,
# properties, INI.
path = '''(?i)(?:^|/)(?:\.env(?:\.[\w.-]+)?|\.envrc|[^/]+\.(?:env|ya?ml|properties|ini|cfg|conf|toml))$'''
regex = '''(?im)(?:password|passwd|secret|token|api[_-]?key|(?:secret|private|access|signing|encryption|master|auth)[_-]?key|(?:\b|[_.-])(?:pwd|pass))(?:[_.-](?:prod|production|dev|development|stage|staging|test|qa|uat|live|local|old|new))?\d*[ \t]{0,5}(?:=|:)[ \t]{0,5}([^\s"'#;]{6,200})(?:\s|$)'''
secretGroup = 1
entropy = 3.0
keywords = ["password", "passwd", "pwd", "pass", "secret", "token", "api_key", "api-key", "apikey", "key"]

[[rules.allowlists]]
description = "YAML tags, anchors, aliases and block scalars; shell command substitution"
regexTarget = "secret"
# export TOKEN=$(security find-generic-password ...) would otherwise report
# the fragment "$(security".
regexes = ['''^[!&*|>]''', '''^(?:\$\(|`)''']

[[rules]]
id = "connection-string-credentials"
description = "Connection string or URL with an embedded password"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|amqps?|mssql|sqlserver|https?|ftps?|jdbc:[a-z0-9]+)://[^:@/\s"']*:([^:@/\s"']{4,200})@[^\s"'/]+'''
secretGroup = 1
keywords = ["://"]

[[rules.allowlists]]
description = "Well-known local development passwords"
regexTarget = "secret"
regexes = ['''(?i:^(?:postgres|root|guest|admin|test|testing|password|passwd|pass|pwd|secret)$)''']

[[rules.allowlists]]
description = "Local-only hosts"
regexTarget = "match"
regexes = ['''(?i:@(?:localhost|127\.0\.0\.1|\[::1\])(?:[:/]|$))''']

# Placeholders and templates: not secrets for any of the password-style rules,
# including the upstream generic-api-key rule.
[[allowlists]]
description = "Placeholders and templates"
targetRules = ["generic-api-key", "hardcoded-password", "hardcoded-password-unquoted", "connection-string-credentials"]
regexTarget = "secret"
regexes = [
  '''(?i:change[_-]?me|placeholder|example|dummy|redacted)''',
  '''(?i:^(?:password|passwd|secret|test|testing|none|null|undefined|empty|todo|tbd)$)''',
  '''(?i:^x{3,}$)''',
  '''^\*{3,}$''',
  '''\$\{[^}]*\}''',
  '''\{\{[^}]*\}\}''',
  '''^<[^>]*>$''',
  '''%\([^)]*\)s''',
  # $VAR: one segment of letters with up to two trailing digits ($PGPASSWORD,
  # $OAUTH2), or several segments that may each hold one run of 1-2 digits
  # ($K8S_SECRET, $S3_SECRET_KEY). $UPERS3CRET9 is not a name.
  '''^\$(?:[A-Z]+[0-9]{0,2}|[A-Z]+(?:[0-9]{1,2}[A-Z]*)?(?:_[A-Z]+(?:[0-9]{1,2}[A-Z]*)?)+)$''',
  '''^\$\([A-Za-z_][A-Za-z0-9_.]*\)$''',
]

# Values that are names rather than secrets: env var names (DB_PASSWORD,
# OPENAI_API_KEY, S3_SECRET_KEY, K8S_SERVICE_TOKEN), words joined by
# separators (db-credentials, bert-base-uncased, monitoring/basic-auth),
# single or CamelCase words (Authorization, SecretsManager), paths and
# key files (~/.ssh/id_rsa, certs/server.pem), file:/vault:/classpath:
# references, URLs, ARNs and cipher names (aes-256-gcm, hmac-sha256).
# Words are letters only; an env-var segment may also hold one run of 1-2
# digits; a ~/, ./, ../, file:, vault: or classpath: value and a key file
# name must be made of path characters only; cipher names come from a fixed
# vocabulary. So random tokens (QX7Z2LMPK4R8T..., ABCD_EFGH1234_...,
# hunter2-prod, file:Hunter2!prod, rsa-Q9x7...) are still reported, while
# a password made only of letters (Sunshine, correct-horse-battery) is not.
# Only the bundled rules use this list; upstream generic-api-key keeps its
# own behaviour.
[[allowlists]]
description = "Names, identifiers, paths and URLs"
targetRules = ["hardcoded-password", "hardcoded-password-unquoted"]
regexTarget = "secret"
regexes = [
  '''^[A-Z]+(?:[0-9]{1,2}[A-Z]*)?(?:_[A-Z]+(?:[0-9]{1,2}[A-Z]*)?)+$''',
  '''^\p{L}+(?:[-_./]\p{L}+)+[?!.:]?$''',
  '''^\p{Lu}?\p{Ll}+(?:\p{Lu}\p{Ll}+)*$''',
  '''^(?:/|https?://|arn:|s3://|gs://)''',
  '''^(?:~/|\.\.?/|file:|vault:|classpath:)[\w./#-]*$''',
  '''^[\w./:\\-]*\.(?i:pem|key|crt|cer|p12|pfx|jks|keystore|der)$''',
  '''(?i:^(?:aes|rsa|ecdsa|ecdh|ed25519|ed448|x25519|chacha20|xchacha20|hmac|sha)(?:[-_]?(?:\d{1,4}|sha\d{1,3}|gcm|cbc|ctr|ccm|siv|ecb|ofb|cfb|xts|poly1305|oaep|pss|pkcs1|p\d{3})){0,4}$)''',
]
