[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airgap-pr-agent"
version = "0.1.0"
description = "Air-gapped CI agent scanning MRs/PRs for secrets, non-English text and security issues"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic>=2",
    "pyyaml",
    "pygments",
    "lingua-language-detector",
    "pathspec",
    "jinja2",
]

[project.optional-dependencies]
dev = ["pytest", "pip-tools"]

[project.scripts]
pr-agent = "airgap_pr_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airgap_pr_agent = ["defaults.yml", "templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:GitWildMatchPattern:DeprecationWarning"]
